# Checks the Google Drive folders every 6 hours and saves the updated card list.
# Cloudflare Pages republishes the site automatically whenever this list changes.
name: Update cards from Google Drive
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}      # lets you click "Run workflow" for an instant update
permissions:
  contents: write
concurrency: { group: catalog, cancel-in-progress: false }
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Read Drive folders
        run: python3 scripts/build_catalog.py
      - name: Save the updated card list
        run: |
          if git diff --quiet data/catalog.json; then
            echo "No new cards."
          else
            git config user.name "catalog-bot"
            git config user.email "catalog-bot@users.noreply.github.com"
            git add data/catalog.json
            git commit -m "Update card list from Google Drive"
            git push
          fi
