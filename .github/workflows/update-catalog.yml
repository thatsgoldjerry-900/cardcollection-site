# Rebuilds the card list from Google Drive every 6 hours and publishes the site to GitHub Pages.
name: Update cards and publish
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}      # lets you click "Run workflow" for an instant update
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install tools
        run: pip install --quiet openpyxl google-auth requests
      - name: Read Drive folders
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python3 scripts/build_catalog.py
      - name: TCDb want list cards for rainbow pages (from data/tcdb/, matched to the new card list)
        run: python3 scripts/build_rainbow_wants.py && python3 scripts/build_chases.py
      - name: Read private lists (only the chosen columns)
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 scripts/build_lists.py
          # The lists are rebuilt every run and published, never saved in the repo (data/lists is in .gitignore).
          # If they didn't build, stop here so the site keeps its last good version.
          test -s data/lists/husker-pros.json && test -s data/lists/inventory-stats.json
      - name: Plain list and player pages + sitemap (crawlable, built from the lists above)
        run: python3 scripts/build_static_pages.py
      - name: Real page addresses (a page for each collection, player and list, with its own link preview)
        run: python3 scripts/build_route_pages.py
      - name: Team logos for career timelines (Wikipedia, cached; never fails the build)
        run: python3 scripts/build_team_logos.py || true
      - name: Site completeness tracker (reads every player page in a browser; scheduled and manual runs only, never blocks the deploy)
        if: github.event_name != 'push'
        continue-on-error: true
        timeout-minutes: 25
        run: |
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 2
          npm install --no-save playwright@1.49.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          NODE_PATH=$PWD/node_modules node scripts/scrape_tracker.js
          python3 scripts/build_tracker.py
          kill %1 || true
      - name: Save the updated card list
        run: |
          if ! git diff --quiet data/; then
            git config user.name "catalog-bot"
            git config user.email "noreply@anthropic.com"
            git add data/
            git commit -m "Update card list and stats from Google Drive"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: "." }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
